<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jazykový pas</title>
<meta name="description" content="Učenie jazykov každý deň: nové slovíčka krok za krokom, opakovanie v správnej chvíli, hry a príbehy. Funguje offline.">
<meta name="theme-color" content="#F3F4F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1115" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jazyky">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header id="top" class="top"></header>
<main id="view" class="view wrap" tabindex="-1"><p class="muted">Načítavam…</p></main>
<nav id="tabs" class="tabs" aria-label="Sekcie"></nav>

<div id="sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="sheet-in wrap">
    <div class="sheet-top">
      <button class="icon-btn" data-act="close-sheet" aria-label="Zavrieť"><svg class="ic" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      <div class="sheet-title" id="sheet-title"></div>
      <span class="sheet-meta" id="sheet-meta"></span>
    </div>
    <div class="bar"><i id="sheet-bar"></i></div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</div>
<div id="pop" class="pop" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
